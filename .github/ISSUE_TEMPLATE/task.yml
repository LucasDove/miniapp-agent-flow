name: 派一个活
description: 手机上一句话提需求，DAG 自动跑起来，跑完在下面回复验收
title: "[任务] "
labels: []
body:
  - type: textarea
    id: task
    attributes:
      label: 要做什么
      description: 写清改动点和验收标准，越具体返工越少
      placeholder: 把「我的」页头像改成圆形，加一个 44px 的最小点击区，不要动其他页面
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: 模型
      description: 选「默认」= 按 flow.yml 分工（spec/code 用 tencent_cloud_ds_1017，design 用 kimi-k3）；指定某一个则本轮所有 agent 节点都用它
      options:
        - 默认
        - tencent_cloud_ds_1017
        - kimi-k3
        - ds_1017_raw
      default: 0
    validations:
      required: true
